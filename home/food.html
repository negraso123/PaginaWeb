<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PetPal Interactive</title>
    <link rel="stylesheet" href="styles-home.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="btn-menu">
                <label for="btn-menu" class="menu-icon">☰</label>
            </div>
            <nav class="menu">
                <a href="#">Ayuda</a>
                <a href="#">Preguntas Frecuentes</a>
                <a href="#">
                    <img src="https://media.discordapp.net/attachments/1063847894286880869/1279079842729427004/PETPAL_blanco.png?ex=66e39e2e&is=66e24cae&hm=11754be7e25668998d077fca9ee3fd50cacd7d87e083425ad3520588c6c2bbdf&=&format=webp&quality=lossless&width=346&height=350" alt="PetPal Logo" class="logo">
                </a>
            </nav>
        </div>
    </header>

    <div class="center-container">
        <div class="progress-background">
            <div class="progress-container">
                <h2>COMIDA</h2>
                <div class="progress-bar">
                    <div class="progress-bar-inner"></div>
                </div>
                <input type="number" class="progress-input" id="progress-input" placeholder="0-100">
                <button class="btn-fill" id="fill-btn">Llenar</button>
                <div class="error-message" id="error-message"></div>
            </div>
        </div>
    </div>

    <div class="capa"></div>
    <input type="checkbox" id="btn-menu">
    <div class="container-menu">
        <div class="cont-menu">
            <nav>
                <a href="mensage.html">Grabar mensaje</a>
                <a href="food.html">Dispensar comida y/o agua</a>
                <a href="entreteiment.html">Entretenimiento</a>
                <a href="apagar.html">Apagar sistema</a>
            </nav>
            <label for="btn-menu" class="close-btn">⮌</label>
        </div>
    </div>

    <script>
        document.querySelector('.capa').addEventListener('click', function() {
            document.getElementById('btn-menu').checked = false;
        });

        const btnMenu = document.querySelector('.btn-menu');
        const menuCheckbox = document.getElementById('btn-menu');

        menuCheckbox.addEventListener('change', function() {
            if (menuCheckbox.checked) {
                btnMenu.style.display = 'none';
            } else {
                btnMenu.style.display = 'block';
            }
        });

        const fillButton = document.getElementById('fill-btn');
        const progressBarInner = document.querySelector('.progress-bar-inner');
        const progressInput = document.getElementById('progress-input');
        const errorMessage = document.getElementById('error-message');

        fillButton.addEventListener('click', function() {
            const value = parseInt(progressInput.value, 10);
            if (isNaN(value) || value < 0 || value > 100) {
                errorMessage.textContent = 'Debe introducir un número entre 0 y 100.';
                progressBarInner.style.width = '0%';
            } else {
                errorMessage.textContent = '';
                progressBarInner.style.width = value + '%';
            }
        });
    </script>
</body>
</html>
