<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Entretenimiento</title>
    <link rel="stylesheet" href="apagar.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="logotipo">
                <img src="https://media.discordapp.net/attachments/1063847894286880869/1268935923601768568/PETPAL_blanco.png?ex=66c4a5ab&is=66c3542b&hm=5a1b033285c5ac26f1b77788cc32d3def93d208b223b0fc9af75b195721224c0&=&format=webp&quality=lossless&width=463&height=468*" id="logo" width="60" height="60">
            </div>
            <div class="logo">
                <h1>Entretenimiento</h1>
            </div>
            <nav class="menu">
                <a href="home.html">Inicio</a>
            </nav>
        </div>
    </header>
    
    <div class="capa"></div>

    <!-- Menú lateral -->
    <div class="container-menu" id="menu">
        <div class="cont-menu">
            <nav>
                <a href="select.html">Seleccionar mascota</a>
                <a href="mensage.html">Grabar mensaje</a>
                <a href="food.html">Dispensar comida y/o agua</a>
                <a href="entreteiment.html">Entretenimiento</a>
                <a href="#">Apagar sistema</a>
            </nav>
            <label for="btn-menu" id="close-menu">⮌</label>
        </div>
    </div>

    <!-- Contenedor de botones -->
    <div class="contenedor">
        <div class="buttons">
            <button class="button block-button" onclick="togglePiston()">Bloquear/Desbloquear Pistón</button>
            <button class="button eject-button" onclick="eyectarPremio()">Eyector de Premio</button>
        </div>
    </div>

    <script>
        // Variables para el menú y el logo
        const menu = document.getElementById('menu');
        const logo = document.getElementById('logo');
        const closeMenu = document.getElementById('close-menu');

        // Función para alternar el menú
        function toggleMenu() {
            if (menu.style.transform === 'translateX(0%)') {
                menu.style.transform = 'translateX(-100%)';
            } else {
                menu.style.transform = 'translateX(0%)';
            }
        }

        // Añadir evento de clic al logo para alternar el menú
        logo.addEventListener('click', toggleMenu);

        // Función para alternar entre bloquear y desbloquear el pistón
        function togglePiston() {
            alert('Pistón bloqueado/desbloqueado.');
        }

        // Función para eyectar el premio
        function eyectarPremio() {
            alert('Premio eyectado.');
        }

        // Cambiar el cursor al pasar por el logo
        logo.addEventListener('mouseover', function() {
            this.style.cursor = 'pointer';
        });
    </script>
</body>
</html>
