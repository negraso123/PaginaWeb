<!DOCTYPE html>
<html lang="es">
<head>
    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>PetPal Interactive</title>
        <link rel="stylesheet" href="styles-home.css">
    </head>
    <body>
        <header class="header">
            <div class="container">
                <div class="btn-menu">
                    <label for="btn-menu" class="menu-icon">☰</label>
                </div>
                <nav class="menu">
                    <a href="#">Ayuda</a> 
                    <a href="#">Preguntas Frecuentes</a>
                    <a href="#">
                        <a href="home.html">
                        <img src="https://media.discordapp.net/attachments/1063847894286880869/1279079842729427004/PETPAL_blanco.png?ex=66e39e2e&is=66e24cae&hm=11754be7e25668998d077fca9ee3fd50cacd7d87e083425ad3520588c6c2bbdf&=&format=webp&quality=lossless&width=346&height=350" alt="PetPal Logo" class="logo">
                    </a>
                </nav>
            </div>
        </header>
        <div class="capa"></div>
        <input type="checkbox" id="btn-menu">
        <div class="container-menu">
            <div class="cont-menu">
                <nav>
                    <a href="mensage.html">Grabar mensaje</a>
                    <a href="food.html">Dispensar comida y/o agua</a>
                    <a href="entreteiment.html">Entretenimiento</a>
                    <a href="apagar.html">Apagar sistema</a>
                </nav>
                <label for="btn-menu" class="close-btn">⮌</label>
            </div>
        </div>
    <!-- Contenedor de botones -->
    <div class="contenedor">
        <div class="buttons">
            <button class="button block-button" onclick="togglePiston()">Bloquear/Desbloquear Pistón</button>
            <button class="button eject-button" onclick="eyectarPremio()">Eyector de Premio</button>
        </div>
    </div>

    <script>
        // Variables para el menú y el logo
        const menu = document.getElementById('menu');
        const logo = document.getElementById('logo');
        const closeMenu = document.getElementById('close-menu');

        // Función para alternar el menú
        function toggleMenu() {
            if (menu.style.transform === 'translateX(0%)') {
                menu.style.transform = 'translateX(-100%)';
            } else {
                menu.style.transform = 'translateX(0%)';
            }
        }

        // Añadir evento de clic al logo para alternar el menú
        logo.addEventListener('click', toggleMenu);

        // Función para alternar entre bloquear y desbloquear el pistón
        function togglePiston() {
            alert('Pistón bloqueado/desbloqueado.');
        }

        // Función para eyectar el premio
        function eyectarPremio() {
            alert('Premio eyectado.');
        }

        // Cambiar el cursor al pasar por el logo
        logo.addEventListener('mouseover', function() {
            this.style.cursor = 'pointer';
        });
    </script>
</body>
</html>
